<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حسابي والمكافآت</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --ink:#1d2433; --accent:#2f6fed; --muted:#6b7385; --ok:#1a8f4c; --err:#c0392b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,"Segoe UI",Tahoma,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:420px; margin:0 auto; padding:20px 16px 40px; }
  .card { background:var(--card); border-radius:14px; padding:20px; box-shadow:0 1px 6px rgba(0,0,0,.08); margin-top:16px; }
  h1 { font-size:1.3rem; margin:8px 0 0; text-align:center; }
  input { width:100%; padding:12px; margin:6px 0; border:1px solid #cfd5e2; border-radius:10px; font-size:1rem; }
  button { width:100%; padding:12px; margin-top:8px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:1rem; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .points { font-size:2.6rem; font-weight:700; text-align:center; margin:6px 0; }
  .muted { color:var(--muted); text-align:center; font-size:.9rem; }
  .msg { text-align:center; margin-top:10px; min-height:1.2em; font-size:.95rem; }
  .msg.err { color:var(--err); } .msg.ok { color:var(--ok); }
  .hidden { display:none; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  td { padding:6px 4px; border-bottom:1px solid #eef0f5; }
</style>
</head>
<body>
<main>
  <h1>حسابي والمكافآت</h1>

  <!-- تسجيل الدخول / التسجيل -->
  <section id="authBox" class="card">
    <input id="name" placeholder="الاسم (عند التسجيل فقط)" maxlength="40">
    <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email">
    <input id="password" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" autocomplete="current-password">
    <button id="loginBtn">دخول</button>
    <button id="signupBtn" class="ghost">إنشاء حساب جديد</button>
    <button id="resetBtn" class="ghost">نسيت كلمة المرور</button>
  </section>

  <!-- بانتظار تأكيد البريد -->
  <section id="verifyBox" class="card hidden">
    <p class="muted">أرسلنا رسالة تأكيد إلى بريدك. افتح الرابط الذي فيها ثم اضغط الزر.</p>
    <button id="checkVerifyBtn">لقد أكدت بريدي</button>
    <button id="resendBtn" class="ghost">إعادة إرسال الرسالة</button>
    <button id="logoutBtn1" class="ghost">خروج</button>
  </section>

  <!-- صفحة العضو -->
  <section id="memberBox" class="card hidden">
    <div class="muted" id="who"></div>
    <div class="points" id="points">0</div>
    <div class="muted">رصيد النقاط</div>
    <button id="claimBtn">استلم مكافأتك اليومية</button>
    <div class="muted" id="countdown"></div>
    <h3 style="margin-bottom:4px">آخر العمليات</h3>
    <table id="log"></table>
    <button id="logoutBtn2" class="ghost">خروج</button>
  </section>

  <div id="msg" class="msg"></div>
</main>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword,
         sendEmailVerification, sendPasswordResetEmail, signOut, updateProfile }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, writeBatch, collection, serverTimestamp,
         Timestamp, increment, onSnapshot, query, orderBy, limit }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const DAY = 24 * 60 * 60 * 1000;
let unsubUser = null, unsubLog = null, timer = null, lastClaimMs = 0, userActive = true;

function say(text, kind) { const m = $("msg"); m.textContent = text || ""; m.className = "msg " + (kind || ""); }
function show(which) {
  for (const id of ["authBox","verifyBox","memberBox"]) $(id).classList.toggle("hidden", id !== which);
}
function errText(e) {
  const c = e && e.code || "";
  if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found")) return "البريد أو كلمة المرور غير صحيحة.";
  if (c.includes("email-already-in-use")) return "هذا البريد مسجّل من قبل.";
  if (c.includes("weak-password")) return "كلمة المرور ضعيفة (6 أحرف على الأقل).";
  if (c.includes("invalid-email")) return "البريد الإلكتروني غير صالح.";
  if (c.includes("too-many-requests")) return "محاولات كثيرة، انتظر قليلًا ثم أعد المحاولة.";
  if (c.includes("permission-denied")) return "غير مسموح بهذه العملية الآن.";
  return "حدث خطأ، أعد المحاولة.";
}

$("signupBtn").onclick = async () => {
  say("");
  try {
    const cred = await createUserWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
    const nm = $("name").value.trim().slice(0, 40);
    if (nm) await updateProfile(cred.user, { displayName: nm });
    await sendEmailVerification(cred.user);
    say("تم إنشاء الحساب. تحقق من بريدك.", "ok");
  } catch (e) { say(errText(e), "err"); }
};
$("loginBtn").onclick = async () => {
  say("");
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value); }
  catch (e) { say(errText(e), "err"); }
};
$("resetBtn").onclick = async () => {
  const em = $("email").value.trim();
  if (!em) return say("اكتب بريدك أولًا.", "err");
  try { await sendPasswordResetEmail(auth, em); say("أرسلنا رابط استعادة كلمة المرور.", "ok"); }
  catch (e) { say(errText(e), "err"); }
};
$("resendBtn").onclick = async () => {
  try { await sendEmailVerification(auth.currentUser); say("أعدنا إرسال الرسالة.", "ok"); }
  catch (e) { say(errText(e), "err"); }
};
$("checkVerifyBtn").onclick = async () => {
  await auth.currentUser.reload();
  await auth.currentUser.getIdToken(true);
  location.reload();
};
for (const id of ["logoutBtn1","logoutBtn2"]) $(id).onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  if (unsubUser) unsubUser(); if (unsubLog) unsubLog(); clearInterval(timer);
  say("");
  if (!user) return show("authBox");
  if (!user.emailVerified) return show("verifyBox");
  show("memberBox");

  const uref = doc(db, "users", user.uid);
  try {
    const snap = await getDoc(uref);
    if (!snap.exists()) {
      await setDoc(uref, {
        name: user.displayName || user.email.split("@")[0].slice(0, 40),
        email: user.email, points: 0, status: "active",
        lastClaim: Timestamp.fromMillis(0), createdAt: serverTimestamp(),
      });
    }
  } catch (e) { return say(errText(e), "err"); }

  unsubUser = onSnapshot(uref, s => {
    const d = s.data(); if (!d) return;
    $("who").textContent = d.name;
    $("points").textContent = d.points;
    lastClaimMs = d.lastClaim.toMillis();
    userActive = d.status === "active";
    tick();
  });
  unsubLog = onSnapshot(query(collection(uref, "log"), orderBy("at", "desc"), limit(8)), s => {
    const t = $("log"); t.textContent = "";
    s.forEach(x => {
      const d = x.data(), tr = t.insertRow();
      tr.insertCell().textContent = d.at ? d.at.toDate().toLocaleString("ar") : "";
      tr.insertCell().textContent = (d.delta > 0 ? "+" : "") + d.delta;
      tr.insertCell().textContent = d.reason === "daily" ? "مكافأة يومية" : "تعديل من الإدارة";
    });
  });
  timer = setInterval(tick, 1000);
});

function tick() {
  const left = lastClaimMs + DAY - Date.now();
  const b = $("claimBtn");
  if (!userActive) { b.disabled = true; $("countdown").textContent = "الحساب معطّل."; return; }
  if (left > 0) {
    b.disabled = true;
    const h = Math.floor(left / 3600000), m = Math.floor(left % 3600000 / 60000), s = Math.floor(left % 60000 / 1000);
    $("countdown").textContent = `المكافأة التالية بعد ${h}س ${m}د ${s}ث`;
  } else { b.disabled = false; $("countdown").textContent = ""; }
}

$("claimBtn").onclick = async () => {
  say("");
  const user = auth.currentUser;
  try {
    const cfgSnap = await getDoc(doc(db, "config", "daily"));
    if (!cfgSnap.exists() || !cfgSnap.data().enabled) return say("المكافأة اليومية متوقفة حاليًا.", "err");
    const pts = cfgSnap.data().points;
    const uref = doc(db, "users", user.uid);
    const batch = writeBatch(db);
    batch.update(uref, { points: increment(pts), lastClaim: serverTimestamp() });
    batch.set(doc(collection(uref, "log")), { delta: pts, reason: "daily", at: serverTimestamp() });
    await batch.commit();
    say(`تمت إضافة ${pts} نقطة إلى رصيدك.`, "ok");
  } catch (e) { say("لا يمكن الاستلام الآن. ربما لم تمر 24 ساعة بعد.", "err"); }
};
</script>
</body>
</html>
