<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الإدارة</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --ink:#1d2433; --accent:#2f6fed; --muted:#6b7385; --ok:#1a8f4c; --err:#c0392b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,"Segoe UI",Tahoma,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:900px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border-radius:14px; padding:16px; box-shadow:0 1px 6px rgba(0,0,0,.08); margin-top:14px; }
  h1,h2 { margin:6px 0 10px; }
  input,select { padding:9px; border:1px solid #cfd5e2; border-radius:8px; font-size:.95rem; }
  button { padding:9px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button.danger { background:var(--err); }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:6px 0; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; min-width:640px; }
  th,td { padding:6px 4px; border-bottom:1px solid #eef0f5; text-align:right; }
  td input { width:100%; }
  .msg { min-height:1.2em; margin-top:8px; } .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1>لوحة الإدارة</h1>

  <section id="loginBox" class="card">
    <div class="row">
      <input id="email" type="email" placeholder="بريد الإدارة">
      <input id="password" type="password" placeholder="كلمة المرور">
      <button id="loginBtn">دخول</button>
    </div>
  </section>

  <div id="panel" class="hidden">
    <section class="card">
      <h2>المكافأة اليومية</h2>
      <div class="row">
        <label>عدد النقاط <input id="cfgPoints" type="number" min="0" step="1" style="width:100px"></label>
        <label><input id="cfgEnabled" type="checkbox"> مفعّلة</label>
        <button id="saveCfg">حفظ</button>
      </div>
    </section>

    <section class="card">
      <h2>الأعضاء <span id="count" style="font-weight:400;color:var(--muted)"></span></h2>
      <div class="row">
        <input id="search" placeholder="بحث بالاسم أو البريد" style="flex:1">
        <button id="reload" class="ghost">تحديث</button>
        <button id="logout" class="ghost">خروج</button>
      </div>
      <div class="scroll">
        <table>
          <thead><tr><th>الاسم</th><th>البريد</th><th>النقاط</th><th>الحالة</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </div>

  <div id="msg" class="msg"></div>
</main>

<script type="module">
import { firebaseConfig, ADMIN_EMAIL } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, getDocs, collection, writeBatch, serverTimestamp, query, orderBy }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
let users = [];

function say(t, k) { $("msg").textContent = t || ""; $("msg").className = "msg " + (k || ""); }

$("loginBtn").onclick = async () => {
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value); }
  catch { say("بيانات الدخول غير صحيحة.", "err"); }
};
$("logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  const ok = user && user.emailVerified && user.email === ADMIN_EMAIL;
  $("loginBox").classList.toggle("hidden", !!ok);
  $("panel").classList.toggle("hidden", !ok);
  if (user && !ok) { say("هذا الحساب ليس حساب الإدارة.", "err"); await signOut(auth); return; }
  if (ok) { await loadCfg(); await loadUsers(); }
});

async function loadCfg() {
  const s = await getDoc(doc(db, "config", "daily"));
  const d = s.exists() ? s.data() : { points: 10, enabled: false };
  $("cfgPoints").value = d.points; $("cfgEnabled").checked = d.enabled;
}
$("saveCfg").onclick = async () => {
  const p = Math.max(0, Math.floor(Number($("cfgPoints").value) || 0));
  try {
    await setDoc(doc(db, "config", "daily"), { points: p, enabled: $("cfgEnabled").checked });
    say("تم حفظ إعدادات المكافأة.", "ok");
  } catch { say("تعذّر الحفظ.", "err"); }
};

async function loadUsers() {
  const snap = await getDocs(query(collection(db, "users"), orderBy("createdAt", "desc")));
  users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  render();
}
$("reload").onclick = loadUsers;
$("search").oninput = render;

function render() {
  const q = $("search").value.trim().toLowerCase();
  const list = users.filter(u => !q || u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q));
  $("count").textContent = `(${list.length})`;
  const tb = $("rows"); tb.textContent = "";
  for (const u of list) {
    const tr = tb.insertRow();
    const name = document.createElement("input"); name.value = u.name; name.maxLength = 40;
    const pts = document.createElement("input"); pts.type = "number"; pts.value = u.points;
    const st = document.createElement("select");
    for (const [v, t] of [["active", "نشط"], ["disabled", "معطّل"]]) {
      const o = document.createElement("option"); o.value = v; o.textContent = t; if (u.status === v) o.selected = true; st.append(o);
    }
    tr.insertCell().append(name);
    tr.insertCell().textContent = u.email;
    tr.insertCell().append(pts);
    tr.insertCell().append(st);
    const act = tr.insertCell();
    const save = document.createElement("button"); save.textContent = "حفظ";
    const del = document.createElement("button"); del.textContent = "حذف"; del.className = "danger";
    act.append(save, " ", del);

    save.onclick = async () => {
      const newPts = Math.floor(Number(pts.value));
      const nm = name.value.trim().slice(0, 40);
      if (!nm || !Number.isFinite(newPts)) return say("تحقق من الاسم والنقاط.", "err");
      try {
        const b = writeBatch(db);
        const ref = doc(db, "users", u.id);
        b.update(ref, { name: nm, points: newPts, status: st.value });
        if (newPts !== u.points) {
          b.set(doc(collection(ref, "log")), { delta: newPts - u.points, reason: "admin", by: auth.currentUser.email, at: serverTimestamp() });
        }
        await b.commit();
        Object.assign(u, { name: nm, points: newPts, status: st.value });
        say("تم الحفظ.", "ok");
      } catch { say("تعذّر الحفظ.", "err"); }
    };
    del.onclick = async () => {
      if (!confirm(`حذف حساب ${u.name} نهائيًا؟`)) return;
      try {
        const b = writeBatch(db);
        b.delete(doc(db, "users", u.id));
        await b.commit();
        users = users.filter(x => x.id !== u.id); render(); say("تم الحذف.", "ok");
      } catch { say("تعذّر الحذف.", "err"); }
    };
  }
}
</script>
</body>
</html>
